repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7          # pin an exact Ruff release
    hooks:
      - id: ruff-format   # Black-compatible code formatter
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--profile=black]  # keeps style aligned with Ruff/Black