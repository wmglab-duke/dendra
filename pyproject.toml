[build-system]
requires = ["setuptools", "cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "axonml"
requires-python = ">=3.11"
readme = "README.md"

dynamic = ["version", "dependencies"]

[project.optional-dependencies]
doc = [
    "jupyter_contrib_nbextensions",
    "notebook <= 6.4.12",
    "traitlets <= 5.9.0",
    "ipython <= 8.9.0",
    "mkdocs",
    "mkdocs-material",
    "markdown-include",
    "mkdocs-redirects",
    "mkdocstrings[python]>=0.18",
    "mike",
    "sphinx",
    "sphinx-autobuild",
    "sphinx_autodoc_typehints",
    "sphinx-math-dollar",
    "myst-nb",
    "jupytext",
    "shibuya",
]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pytest-xdist",
    "commitizen"
]

[tool.setuptools.dynamic]
version = {attr = "axonml.__version__"}

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["axonml*",]  # package names should match these glob patterns (["*"] by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[tool.setuptools.package-data]
"axonml" = ["trained/*"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.12.0"
version_provider = "commitizen"
version_scheme = "pep440"
version_files = ["axonml/__init__.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
bump_message = "build(release): bump version to $new_version [skip ci]"

major_version_zero = true
