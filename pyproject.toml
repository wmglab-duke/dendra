[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dendra"
description = "Differentiable neuronal simulation and macroscopic descriptor optimization"
requires-python = ">=3.11"
readme = "README.md"
license = "LicenseRef-Duke-Research-NonCommercial"
license-files = ["LICENSE.md"]

dynamic = ["version", "dependencies"]

[project.urls]
Documentation = "https://wmglab-duke.github.io/dendra/"
Repository = "https://github.com/wmglab-duke/dendra"

[project.optional-dependencies]
solvers = [
    "dendra-solvers>=0.3.1",
]
jupyter = [
    "ipympl >= 0.9.5",
]
doc = [
    "jupyter_contrib_nbextensions",
    "notebook <= 6.4.12",
    "traitlets <= 5.9.0",
    "ipython <= 8.9.0",
    "mkdocs",
    "mkdocs-material",
    "markdown-include",
    "mkdocs-redirects",
    "mkdocstrings[python]>=0.18",
    "mike",
    "sphinx",
    "sphinx-autobuild",
    "sphinx_autodoc_typehints",
    "sphinx-math-dollar",
    "myst-nb",
    "jupytext",
    "shibuya",
]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pytest-xdist",
    "commitizen"
]

[project.scripts]
dendra = "dendra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "cpu: tests that require neither CUDA nor the NEURON simulator",
    "cuda: tests that require a CUDA-capable PyTorch runtime",
    "neuron: tests that require NEURON; the non-CUDA subset is required in CI",
    "slow: longer-running integration or simulator-comparison tests",
    "stochastic: tests of stochastic or property-generated behavior",
]

[tool.setuptools.dynamic]
version = {attr = "dendra.__version__"}

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["dendra*",]  # package names should match these glob patterns (["*"] by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[tool.setuptools.package-data]
"dendra.models.networks" = [
    "netcon_bitpack_kernel.cpp",
    "netcon_bitpack_kernel.cu",
]

[tool.setuptools.exclude-package-data]
"dendra.models.heterogeneous" = ["ops.cpp"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.27.0"
version_provider = "commitizen"
version_scheme = "pep440"
version_files = ["dendra/__init__.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
bump_message = "build(release): bump version to $new_version [skip ci]"

major_version_zero = true
