[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dendra"
requires-python = ">=3.11"
readme = "README.md"

dynamic = ["version", "dependencies"]

[project.optional-dependencies]
jupyter = [
    "ipympl >= 0.9.5",
]
doc = [
    "jupyter_contrib_nbextensions",
    "notebook <= 6.4.12",
    "traitlets <= 5.9.0",
    "ipython <= 8.9.0",
    "mkdocs",
    "mkdocs-material",
    "markdown-include",
    "mkdocs-redirects",
    "mkdocstrings[python]>=0.18",
    "mike",
    "sphinx",
    "sphinx-autobuild",
    "sphinx_autodoc_typehints",
    "sphinx-math-dollar",
    "myst-nb",
    "jupytext",
    "shibuya",
]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pytest-xdist",
    "commitizen"
]

[project.scripts]
dendra = "dendra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "cpu: tests that require neither CUDA nor the NEURON simulator",
    "cuda: tests that require a CUDA-capable PyTorch runtime",
    "neuron: tests that require NEURON; the non-CUDA subset is required in CI",
    "slow: longer-running integration or simulator-comparison tests",
    "stochastic: tests of stochastic or property-generated behavior",
]

[tool.dendra.coverage-floors]
"dendra/data/h5.py" = 98
"dendra/models/_class_declarations.py" = 98
"dendra/models/analysis.py" = 79
"dendra/models/callbacks.py" = 84
"dendra/models/core.py" = 66
"dendra/models/extcell.py" = 91
"dendra/models/fields/line.py" = 98
"dendra/models/fields/precomputed.py" = 90
"dendra/models/graph.py" = 91
"dendra/models/heterogeneous/compartments.py" = 95
"dendra/models/integrators/core.py" = 85
"dendra/models/integrators/explicit.py" = 95
"dendra/models/integrators/imex.py" = 96
"dendra/models/integrators/implicit.py" = 85
"dendra/models/integrators/tree.py" = 85
"dendra/models/integrators/tree_bt.py" = 89
"dendra/models/integrators/triton/_contracts.py" = 58
"dendra/models/io.py" = 78
"dendra/models/mechanisms/_bufferimplicit.py" = 84
"dendra/models/mechanisms/_derivimplicit.py" = 70
"dendra/models/mechanisms/_handler.py" = 75
"dendra/models/mechanisms/_kinetic.py" = 90
"dendra/models/mechanisms/_linearimplicit.py" = 87
"dendra/models/mechanisms/_material_process.py" = 75
"dendra/models/mechanisms/_materials.py" = 90
"dendra/models/mechanisms/_mechanism.py" = 72
"dendra/models/mechanisms/_numerical.py" = 80
"dendra/models/mechanisms/_rosenbrock.py" = 87
"dendra/models/mechanisms/_solvers.py" = 98
"dendra/models/mechanisms/_spatial.py" = 72
"dendra/models/mechanisms/_symbolic.py" = 85
"dendra/models/mechanisms/compilers/ast.py" = 80
"dendra/models/mechanisms/ode.py" = 71
"dendra/models/multi.py" = 85
"dendra/models/networks/net.py" = 65
"dendra/models/networks/netcon.py" = 67
"dendra/models/networks/netcon_bitpack_contracts.py" = 75
"dendra/models/networks/netcon_bitpack_ops.py" = 54
"dendra/models/networks/netstim.py" = 74
"dendra/models/parametric.py" = 82
"dendra/models/rng.py" = 93
"dendra/models/slice.py" = 78
"dendra/models/stim/extra.py" = 96
"dendra/models/stim/intra.py" = 96
"dendra/models/stim/waveform/core.py" = 87
"dendra/models/stim/waveform/implementations.py" = 87
"dendra/models/tree.py" = 89
"dendra/models/utils.py" = 85
"dendra/opt/utils.py" = 95
"dendra/utils/interpolation.py" = 79
"dendra/utils/neuron.py" = 90
"dendra/utils/tensor_ops.py" = 90

[tool.setuptools.dynamic]
version = {attr = "dendra.__version__"}

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["dendra*",]  # package names should match these glob patterns (["*"] by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[tool.setuptools.package-data]
"dendra.models.networks" = [
    "netcon_bitpack_kernel.cpp",
    "netcon_bitpack_kernel.cu",
]

[tool.setuptools.exclude-package-data]
"dendra.models.heterogeneous" = ["ops.cpp"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.23.1"
version_provider = "commitizen"
version_scheme = "pep440"
version_files = ["dendra/__init__.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
bump_message = "build(release): bump version to $new_version [skip ci]"

major_version_zero = true
