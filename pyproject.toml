[build-system]
requires = ["setuptools", "cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "axonml"
version = "0.2"

dynamic = ["dependencies"]

[project.optional-dependencies]
jupyter = ["jupyter"]
doc = [
    "jupyter_contrib_nbextensions",
    "notebook <= 6.4.12",
    "traitlets <= 5.9.0",
    "ipython <= 8.9.0",
    "mkdocs",
    "mkdocs-material",
    "markdown-include",
    "mkdocs-redirects",
    "mkdocstrings[python]>=0.18",
    "mike",
    "sphinx",
    "sphinx-autobuild",
    "sphinx_autodoc_typehints",
    "sphinx-math-dollar",
    "myst-nb",
    "jupytext",
    "sphinx-book-theme",
]

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["axonml"]  # package names should match these glob patterns (["*"] by default)
exclude = ["extern"]  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)
