image: python:3.12-slim

stages:
  - test
  - build
  - release
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DEBIAN_FRONTEND: noninteractive

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip

before_script:
  - apt-get update && apt-get install -y --no-install-recommends git build-essential ffmpeg
  - rm -rf /var/lib/apt/lists/*

  - python -m pip install --upgrade pip

  # Constrain runtime environment to NumPy < 2 (works on older/limited virtual CPUs)
  - printf "numpy<2\n" > "$CI_PROJECT_DIR/constraints.txt"
  - export PIP_CONSTRAINT="$CI_PROJECT_DIR/constraints.txt"

  # Install NumPy early so anything built w/ --no-build-isolation can see it
  - python -m pip install numpy

  # 1) Install PyTorch first
  - python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

  # 2) Clone and install dendra-solvers AFTER torch (still no-build-isolation)
  - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.oit.duke.edu/mah148/dendra-solvers.git"
  - cd dendra-solvers && python -m pip install --no-build-isolation . && cd "$CI_PROJECT_DIR"

  # 3) Install your main package with [doc] extra
  # Use build-constraint ONLY here (no --no-build-isolation on this command)
  - python -m pip install --build-constraint "$CI_PROJECT_DIR/constraints.txt" ".[doc]"

  # 4) Clone and install dendra-models AFTER dendra and torch
  - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.oit.duke.edu/mah148/dendra-models.git"
  - cd dendra-models && python -m pip install --build-constraint "$CI_PROJECT_DIR/constraints.txt" . && cd "$CI_PROJECT_DIR"

  # Optional: verify in logs
  - python -c "import numpy as np; print('NumPy:', np.__version__)"
  - python -c "import torch; print('PyTorch:', torch.__version__)"
  - python -c "import neuron; print('NEURON:', neuron.__version__)"
  - python -c "import dendra; print('Dendra:', dendra.__version__)"
  - python -c "import dendra_models; print('Dendra-Models:', dendra_models.__version__)"

test:
  stage: test
  script:
    - python -m pip install pytest pytest-cov hypothesis neuron
    - python -m pytest tests -W error -m "cpu or (neuron and not cuda)" --cov=dendra --cov-branch --cov-config=.coveragerc.cpu --cov-report=term-missing:skip-covered --cov-report=json:coverage.json --cov-report=xml --cov-report=html --cov-fail-under=75
    - python scripts/check_coverage_floors.py coverage.json
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths:
      - htmlcov/
      - coverage.json
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

build_docs:
  stage: build
  script:
    - sphinx-build -W --keep-going -b html docs docs/_build/html
    - mkdir -p public
    - cp -r docs/_build/html/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week

release_bump:
  stage: release
  image: python:3.12-slim
  needs: ["build_docs"]
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - python -m pip install commitizen

    - git config user.name  "gitlab-ci"
    - git config user.email "gitlab-ci@duke.edu"

    # Ensure tags + full history are present
    - git fetch --tags --force

    # Authenticate pushes using CI_JOB_TOKEN
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    # Preview (won't fail job if there's nothing to bump)
    - cz -nr NO_INCREMENT bump --dry-run --major-version-zero

    # Perform bump (breaking changes won't jump to 1.0.0)
    - cz -nr NO_INCREMENT bump --yes --major-version-zero

    # Push bump commit and tags back to main
    - git push origin HEAD:main
    - git push origin --tags
  rules:
    # Run only on main branch "push" pipelines, and don't run on bump commits that contain [skip ci]
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/i'
      when: on_success
    - when: never

pages:
  stage: deploy
  before_script: []
  dependencies:
    - build_docs
  script:
    - echo "Deploying GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
