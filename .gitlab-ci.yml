image: python:3.12-slim

stages:
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DEBIAN_FRONTEND: noninteractive

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip

before_script:
  - apt-get update && apt-get install -y --no-install-recommends git build-essential ffmpeg
  - rm -rf /var/lib/apt/lists/*

  # Optional: useful debug if you want to confirm missing ISA flags
  - uname -m
  - grep -m1 -E "model name|flags" /proc/cpuinfo || true

  - python -m pip install --upgrade pip

  # Force NumPy < 2 everywhere (including build isolation subprocesses)
  - printf "numpy<2\n" > "$CI_PROJECT_DIR/constraints.txt"
  - export PIP_CONSTRAINT="$CI_PROJECT_DIR/constraints.txt"
  - export PIP_BUILD_CONSTRAINT="$CI_PROJECT_DIR/constraints.txt"

  # Install NumPy early so downstream installs don't pull NumPy 2.x
  - python -m pip install numpy

  # 1) Install PyTorch first
  - python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu

  # 2) Clone and install axonml-solvers AFTER torch
  - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.oit.duke.edu/mah148/axonml-solvers.git"
  - cd axonml-solvers && python -m pip install --no-build-isolation . && cd "$CI_PROJECT_DIR"

  # 3) Install your main package with [doc] extra
  - python -m pip install ".[doc]"


build_docs:
  stage: build
  script:
    - sphinx-build -b html docs docs/_build/html
    - mkdir -p public
    - cp -r docs/_build/html/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week

pages:
  stage: deploy
  # override the global before_script
  before_script: []
  dependencies:
    - build_docs
  script:
    - echo "Deploying GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
