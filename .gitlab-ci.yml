image: python:3.12-slim

stages:
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DEBIAN_FRONTEND: noninteractive

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip

before_script:
  # Install git (and optionally compilers)
  - apt-get update && apt-get install -y --no-install-recommends git build-essential
  - rm -rf /var/lib/apt/lists/*

  - python -m pip install --upgrade pip

  # 1) Install PyTorch first
  - python -m pip install "torch==2.9.0" --index-url https://download.pytorch.org/whl/cpu

  # 2) Clone and install axonml-solvers AFTER torch
  - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.oit.duke.edu/mah148/axonml-solvers.git"
  - cd axonml-solvers && python -m pip install --no-build-isolation . && cd "$CI_PROJECT_DIR"

  # 3) Install your main package with [doc] extra
  - python -m pip install ".[doc]"

build_docs:
  stage: build
  script:
    - sphinx-build -b html docs docs/_build/html
    - mkdir -p public
    - cp -r docs/_build/html/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week

pages:
  stage: deploy
  # override the global before_script
  before_script: []
  dependencies:
    - build_docs
  script:
    - echo "Deploying GitLab Pages"
  artifacts:
    paths:
      - public
