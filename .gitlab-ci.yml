image: python:3.12-slim

stages:
  - test
  - build
  - release
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DEBIAN_FRONTEND: noninteractive

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip

before_script:
  - apt-get update && apt-get install -y --no-install-recommends git build-essential ffmpeg
  - rm -rf /var/lib/apt/lists/*

  - python -m pip install --upgrade pip

  # Constrain runtime environment to NumPy < 2 (works on older/limited virtual CPUs)
  - printf "numpy<2\n" > "$CI_PROJECT_DIR/constraints.txt"
  - export PIP_CONSTRAINT="$CI_PROJECT_DIR/constraints.txt"

  # Install NumPy early so anything built w/ --no-build-isolation can see it
  - python -m pip install numpy

  # 1) Install PyTorch first
  - python -m pip install "torch==2.12.0" --index-url https://download.pytorch.org/whl/cpu

  # 2) Include optional native solvers for the full test and documentation lanes.
  # Require the published wheel so CI exercises the distributed artifact.
  # Use build-constraint ONLY here (no --no-build-isolation on this command)
  - python -m pip install --only-binary=dendra-solvers --build-constraint "$CI_PROJECT_DIR/constraints.txt" ".[doc,solvers]"

  # 3) Clone and install dendra-models AFTER dendra and torch
  - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.oit.duke.edu/dendra-dev/dendra-models.git"
  - git -C dendra-models checkout --detach "$(cat "$CI_PROJECT_DIR/docs/dendra-models-gitlab-revision.txt")"
  # Dendra itself is the source checkout under test. Avoid asking pip to
  # resolve dendra-models' released Dendra floor before Commitizen has bumped
  # this checkout at the end of the successful pipeline.
  - cd dendra-models && python -m pip install --no-deps --build-constraint "$CI_PROJECT_DIR/constraints.txt" . && cd "$CI_PROJECT_DIR"

  # Verify the installed versions and load the solver's native extension early.
  - |
    python - <<'PY'
    from importlib.metadata import version
    import numpy as np
    import torch
    import neuron
    import dendra_solvers._ext as solvers_ext
    import dendra
    import dendra_models

    print('NumPy:', np.__version__)
    print('PyTorch:', torch.__version__)
    print('NEURON:', neuron.__version__)
    print('Dendra-Solvers:', version('dendra-solvers'), solvers_ext.__file__)
    print('Dendra:', dendra.__version__)
    print('Dendra-Models:', dendra_models.__version__)
    PY

# Keep prose-only branch pipelines focused on the executable documentation build.
# Runtime, packaging, test, CI, and internal model-revision changes still run
# both test lanes. Set RUN_FULL_TESTS=1 as a CI/CD variable to override the
# changed-path filter for a branch pipeline.
.full_test_rules:
  rules:
    - if: '$RUN_FULL_TESTS == "1" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes:
        paths:
          - dendra/**/*
          - tests/**/*
          - scripts/**/*
          - examples/**/*
          - pyproject.toml
          - setup.py
          - .coveragerc.cpu
          - coverage-floors.toml
          - .gitlab-ci.yml
          - .gitmodules
          - docs/dendra-models-gitlab-revision.txt
    - if: '$CI_PIPELINE_SOURCE != "push" && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE != "external_pull_request_event"'

test_base_install:
  extends: .full_test_rules
  stage: test
  # Override the full test setup: this lane must never install native solvers.
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install "torch==2.12.0" --index-url https://download.pytorch.org/whl/cpu
    - printf "numpy<2\ndendra-solvers==0\n" > "$CI_PROJECT_DIR/base-constraints.txt"
    - python -m pip install --constraint "$CI_PROJECT_DIR/base-constraints.txt" .
  script:
    # Isolated mode imports the installed distribution, not the source checkout.
    - |
      python -I - <<'PY'
      from importlib.util import find_spec
      from pathlib import Path
      import warnings

      import torch
      import dendra as dn
      import dendra.models.analysis as analysis
      from dendra.models.integrators.tridiag import pcr_solve_t
      from dendra.models.mod import pas

      assert find_spec("dendra_solvers") is None
      assert not Path(dn.__file__).resolve().is_relative_to(Path.cwd().resolve())
      assert not Path(analysis.__file__).resolve().is_relative_to(Path.cwd().resolve())
      with dn.ctx(JIT=0, REQUIRE_GRAD=0, DEVICE="cpu"):
          morphology = dn.Morphology()
          morphology.section("path", L=50.0, diam=2.0, nseg=5)
          cable = dn.Cable.from_morphology(
              morphology, N=1, v_init=-65.0, dtype=torch.float64
          )
          cable.insert(pas, g=0.001, e=-70.0)
          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter("always")
              cable.initialize()
              cable.run(tstop=0.1, dt=0.025)
          assert any("Falling back to PCR" in str(item.message) for item in caught)
          assert cable.integrator._solve is pcr_solve_t
          assert torch.isfinite(cable.v).all()
          assert (cable.v < -65.0).all()
      print("Base installation and CPU cable fallback succeeded without native solvers.")
      PY

test:
  extends: .full_test_rules
  stage: test
  script:
    - python -m pip install pytest pytest-cov hypothesis neuron
    - python -m pytest tests -W error -m "cpu or (neuron and not cuda)" --cov=dendra --cov-branch --cov-config=.coveragerc.cpu --cov-report=term-missing:skip-covered --cov-report=json:coverage.json --cov-report=xml --cov-report=html --cov-fail-under=84
    - python scripts/check_coverage_floors.py coverage.json
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths:
      - htmlcov/
      - coverage.json
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

build_docs:
  stage: build
  script:
    # Validate Dendra's documentation strictly and execute every notebook from
    # a fresh Sphinx environment. Remote intersphinx availability must not make
    # an otherwise valid documentation build fail.
    - DENDRA_DOCS_DISABLE_INTERSPHINX=1 sphinx-build -E -W --keep-going -D nb_execution_mode=force -D nb_execution_allow_errors=0 -D nb_execution_raise_on_error=1 -b html docs docs/_build/html
    - mkdir -p public
    - cp -r docs/_build/html/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week

release_bump:
  stage: release
  image: python:3.12-slim
  needs:
    - job: test_base_install
      optional: true
      artifacts: false
    - job: test
      optional: true
      artifacts: false
    - job: build_docs
      artifacts: false
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - python -m pip install commitizen

    - git config user.name  "gitlab-ci"
    - git config user.email "gitlab-ci@duke.edu"

    # Ensure tags + full history are present
    - git fetch --tags --force

    # Authenticate pushes using CI_JOB_TOKEN
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    # Preview (won't fail job if there's nothing to bump)
    - cz -nr NO_INCREMENT bump --dry-run --major-version-zero

    # Perform bump (breaking changes won't jump to 1.0.0)
    - cz -nr NO_INCREMENT bump --yes --major-version-zero

    # Push bump commit and tags back to main
    - git push origin HEAD:main
    - git push origin --tags
  rules:
    # Run only on main branch "push" pipelines, and don't run on bump commits that contain [skip ci]
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/i'
      when: on_success
    - when: never

pages:
  stage: deploy
  before_script: []
  dependencies:
    - build_docs
  script:
    - echo "Deploying GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
