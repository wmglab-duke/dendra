image: python:3.12-slim

stages:
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip

before_script:
  - python -m pip install --upgrade pip

  # 1) Install PyTorch FIRST (CPU build is usually enough for docs)
  #    Pin version / index as you like.
  - python -m pip install "torch==2.4.0" --index-url https://download.pytorch.org/whl/cpu

  # 2) Clone and install axonml-solvers AFTER torch is installed
  #    Use CI_JOB_TOKEN to authenticate to the same GitLab instance
  - |
    git clone \
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.oit.duke.edu/mah148/axonml-solvers.git"
  - cd axonml-solvers
  - python -m pip install --no-build-isolation .
  - cd "$CI_PROJECT_DIR"

  # 3) Install your package with the [doc] extra
  - python -m pip install ".[doc]"

build_docs:
  stage: build
  script:
    # 4) Build the HTML docs
    - sphinx-build -b html docs docs/_build/html
    # GitLab Pages expects ./public
    - mkdir -p public
    - cp -r docs/_build/html/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week

pages:
  stage: deploy
  dependencies:
    - build_docs
  script:
    - echo "Deploying GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
