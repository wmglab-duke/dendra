image: python:3.12-slim

stages:
  - build
  - release
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DEBIAN_FRONTEND: noninteractive

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip

before_script:
  - apt-get update && apt-get install -y --no-install-recommends git build-essential ffmpeg
  - rm -rf /var/lib/apt/lists/*

  - python -m pip install --upgrade pip

  # Constrain runtime environment to NumPy < 2 (works on older/limited virtual CPUs)
  - printf "numpy<2\n" > "$CI_PROJECT_DIR/constraints.txt"
  - export PIP_CONSTRAINT="$CI_PROJECT_DIR/constraints.txt"

  # Install NumPy early so anything built w/ --no-build-isolation can see it
  - python -m pip install numpy

  # 1) Install PyTorch first
  - python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu

  # 2) Clone and install axonml-solvers AFTER torch (still no-build-isolation)
  - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.oit.duke.edu/mah148/axonml-solvers.git"
  - cd axonml-solvers && python -m pip install --no-build-isolation . && cd "$CI_PROJECT_DIR"

  # 3) Install your main package with [doc] extra
  # Use build-constraint ONLY here (no --no-build-isolation on this command)
  - python -m pip install --build-constraint "$CI_PROJECT_DIR/constraints.txt" ".[doc]"

  # 4) Clone and install axonml-models AFTER axonml and torch
  - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.oit.duke.edu/mah148/axonml-models.git"
  - cd axonml-models && python -m pip install --build-constraint "$CI_PROJECT_DIR/constraints.txt" . && cd "$CI_PROJECT_DIR"

  # Optional: verify in logs
  - python -c "import numpy as np; print('NumPy:', np.__version__)"
  - python -c "import torch; print('PyTorch:', torch.__version__)"
  - python -c "import axonml; print('AxonML:', axonml.__version__)"
  - python -c "import axonml_models; print('AxonML-Models:', axonml_models.__version__)"

build_docs:
  stage: build
  script:
    - sphinx-build -b html docs docs/_build/html
    - mkdir -p public
    - cp -r docs/_build/html/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week

release_bump:
  stage: release
  image: python:3.12-slim
  needs: ["build_docs"]
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - python -m pip install commitizen

    - git config user.name  "gitlab-ci"
    - git config user.email "gitlab-ci@duke.edu"

    # Ensure tags + full history are present
    - git fetch --tags --force

    # Authenticate pushes using CI_JOB_TOKEN
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - cz bump --dry-run || true
    - cz bump --yes || (echo "No version bump needed." && exit 0)

    # Push bump commit and tags back to main
    - git push origin HEAD:main
    - git push origin --tags
  rules:
    # Run only on main branch "push" pipelines, and don't run on bump commits that contain [skip ci]
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/i'
      when: on_success
    - when: never

pages:
  stage: deploy
  before_script: []
  dependencies:
    - build_docs
  script:
    - echo "Deploying GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
