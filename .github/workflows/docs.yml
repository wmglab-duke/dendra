name: Documentation

on:
  pull_request:
    paths:
      - "dendra/**"
      - "docs/**"
      - "examples/**"
      - "LICENSE.md"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "dendra/**"
      - "docs/**"
      - "examples/**"
      - "LICENSE.md"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[doc]"
      - name: Build documentation without executing notebooks
        env:
          DENDRA_DOCS_DISABLE_INTERSPHINX: "1"
        run: >-
          sphinx-build -W --keep-going -D nb_execution_mode=off
          -b html docs docs/_build/html
      - name: Configure GitHub Pages
        if: github.repository == 'wmglab-duke/dendra' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.repository == 'wmglab-duke/dendra' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.repository == 'wmglab-duke/dendra' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
